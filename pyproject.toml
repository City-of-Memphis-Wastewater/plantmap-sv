[project]
name = "plantmap-sv"
description = "Python support for plantmap-sv"
dynamic = ["version"]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "dworshak-secret>=1.3.6",
]

[project.optional-dependencies]
crypto = [
    "cryptography>=46.0.3",
    "dworshak-secret[crypto]>=1.3.6",
    "dworshak-prompt[crypto]",
]
